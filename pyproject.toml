[project]
name = "calendar"
version = "0.1.0"
description = "Personal astrological-weather engine: computes transits and serves them as calendar feeds."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyswisseph>=2.10.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "apscheduler>=3.10,<4",
    "icalendar>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",
    "kerykeion>=4.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skycal"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
